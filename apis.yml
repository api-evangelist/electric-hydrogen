aid: electric-hydrogen
name: Electric Hydrogen
description: 'Electric Hydrogen (EH2) is a Massachusetts-based clean-energy company that
  designs, manufactures, and commissions the world''s most powerful PEM electrolyzers,
  packaged into a fully-integrated 100MW HYPRPlant that turns water and renewable electricity
  into the lowest-cost green hydrogen. The complete plant solution bundles power conversion,
  gas processing, water treatment, and thermal management so heavy industry can decarbonize
  ammonia, e-fuels, steel, and refining at gigawatt scale. Founded in 2020 and led by
  CEO Raffi Garabedian, EH2 operates a 1.2GW gigafactory in Devens, Massachusetts, became
  green hydrogen''s first unicorn with a $380M Series C, and is backed by Fifth Wall,
  Fortescue, Energy Impact Partners, bp Ventures, Temasek, and Microsoft''s Climate
  Innovation Fund. This profile enriches the API Evangelist network stub with the
  company''s real public web surface.'
